<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d14;border-radius:14px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Grid Pattern in Background -->
  <g opacity="0.07">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#60a5fa" stroke-width="1" />
    </pattern>
    <rect width="1200" height="360" fill="url(#grid)" />
  </g>

  <!-- Ambient Dynamic Floating Glow Orbs (Subtle background depth) -->
  <g opacity="0.25">
    <circle cx="180" cy="90" r="120" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="cx" values="180;240;180" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="90;130;90" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="120;140;120" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="270" r="140" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="cx" values="1020;960;1020" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="270;220;270" dur="9s" repeatCount="indefinite" />
      <animate attributeName="r" values="140;160;140" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Ambient Dynamic Flow Streams (Lower/Upper edge visual motion) -->
  <g opacity="0.35">
    <path d="M 0 320 Q 300 280, 600 320 T 1200 300" fill="none" stroke="#6366f1" stroke-width="2">
      <animate attributeName="d" values="M 0 320 Q 300 280, 600 320 T 1200 300; M 0 310 Q 300 340, 600 300 T 1200 320; M 0 320 Q 300 280, 600 320 T 1200 300" dur="12s" repeatCount="indefinite" />
    </path>
    <path d="M 0 40 Q 300 70, 600 35 T 1200 50" fill="none" stroke="#0ea5e9" stroke-width="1.5">
      <animate attributeName="d" values="M 0 40 Q 300 70, 600 35 T 1200 50; M 0 50 Q 300 25, 600 55 T 1200 40; M 0 40 Q 300 70, 600 35 T 1200 50" dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Window Frame Border Accent -->
  <rect x="2" y="2" width="1196" height="356" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Terminal Header / Mock Window Controls -->
  <g transform="translate(36, 32)">
    <circle cx="0" cy="0" r="6.5" fill="#ef4444" opacity="0.8" />
    <circle cx="20" cy="0" r="6.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="40" cy="0" r="6.5" fill="#10b981" opacity="0.8" />
    <text x="65" y="4" font-size="13" font-family="'JetBrains Mono', 'Fira Code', monospace" fill="#64748b" letter-spacing="1">terminal@hyper-speed: ~/awesome-terminal-cli</text>
  </g>

  <!-- FOREGROUND CONTENT: Safe from any overlay obscuring -->
  <g text-anchor="middle">
    <!-- Prompt Icon / Tagline -->
    <g transform="translate(600, 100)">
      <rect x="-140" y="-18" width="280" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="0" y="4" fill="#38bdf8" font-size="12.5" font-weight="700" letter-spacing="1.5" font-family="'JetBrains Mono', monospace">⚡ HIGH PERFORMANCE CLI</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="175" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Terminal Emulators &amp; CLI Utilities
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Ecosystem of GPU-Accelerated Terminals, Modern SSH Workspaces &amp; Blazing-Fast CLI Tools
    </text>

    <!-- Decorative Accent Line -->
    <rect x="420" y="246" width="360" height="2" fill="url(#accentLine)" rx="1" />

    <!-- Feature Highlights / Tags -->
    <g transform="translate(600, 290)">
      <!-- Tag 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="0" y="4" font-size="12" font-weight="600" fill="#38bdf8" font-family="'JetBrains Mono', monospace">🚀 GPU Rendered</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-160, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="0" y="4" font-size="12" font-weight="600" fill="#818cf8" font-family="'JetBrains Mono', monospace">🔒 Zero Telemetry</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="0" y="4" font-size="12" font-weight="600" fill="#a855f7" font-family="'JetBrains Mono', monospace">⚡ Rust &amp; Zig CLI</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="0" y="4" font-size="12" font-weight="600" fill="#ec4899" font-family="'JetBrains Mono', monospace">🌐 Multiplexers</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(320, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
        <text x="0" y="4" font-size="12" font-weight="600" fill="#10b981" font-family="'JetBrains Mono', monospace">✨ Cloud SSH</text>
      </g>
    </g>
  </g>
</svg>